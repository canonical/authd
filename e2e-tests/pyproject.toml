[project]
name = "authd-e2e-tests"
version = "0.0.0"
requires-python = ">=3.10.12,<3.15,!=3.11.0,!=3.11.1,!=3.11.2,!=3.11.3"
dependencies = [
    "yarf",
    # Used by the browser-based authentication tests.
    "pygobject",
    # Used to include colored journalctl output in HTML logs.
    "ansi2html",
]

[tool.uv.sources]
yarf = { path = ".yarf" }

[dependency-groups]
robocop = [
    "click>=8.0.0",
    "robotframework-robocop==8.2.4",
]
