# See the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Infrastructure
  ## GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    # Updated with the compiler by update-agentic-workflows.yaml.
    ignore:
      - dependency-name: "github/gh-aw-actions/*" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      gh-actions:
        #applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"

  ## Python lint tools
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "docs/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      minor-updates:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(python)"

  # authd codebase
  ## Go dependencies
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      minor-updates:
        #applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(go)"

  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      minor-updates:
        #applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(go-tools)"

  ## Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      minor-updates:
        #applies-to: version-updates
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(rust)"

  ## E2E Python dependencies
  - package-ecosystem: "uv"
    directory: "/e2e-tests"
    labels: ["dependencies", "e2e-tests"]
    # These dependencies have different locked versions across Python versions.
    # Dependabot's single-version upgrades can fail or downgrade other deps.
    # Update them with uv, preserving YARF's supported Python versions.
    ignore:
      - dependency-name: "attrs"
      - dependency-name: "cattrs"
      - dependency-name: "licensecheck"
      - dependency-name: "markdown"
      - dependency-name: "numpy"
      - dependency-name: "onnxruntime"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
    groups:
      e2e-python:
        patterns: ["*"]
    commit-message:
      prefix: "deps(e2e)"

  ## git submodules
  - package-ecosystem: "gitsubmodule"
    directory: "/" # Directory containing .gitmodules
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    commit-message:
      prefix: "deps(submodule)"

  # brokers codebase
  ## Go dependencies
  - package-ecosystem: "gomod"
    directory: "/brokers" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      minor-updates:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(brokers/go)"

  - package-ecosystem: "gomod"
    directory: "/brokers/tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    groups:
      minor-updates:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(brokers/go-tools)"
