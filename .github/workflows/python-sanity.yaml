name: Python code sanity

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/python-sanity.yaml"
      - ".ruff.toml"
      - ".ruff-requirements.txt"
      - "**/*.py"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sanity:
    name: "Python: Code sanity"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install -r .ruff-requirements.txt
      - name: Run Ruff lint
        run: ruff check --config .ruff.toml --output-format=github .
      - name: Check Ruff formatting
        run: ruff format --check --config .ruff.toml .
