name: authd QA & sanity checks
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/qa.yaml'
      - '!.gitignore'
      - '!.gitmodules'
      - '!*.md'
      - '!COPYING*'
      - '!authd-oidc-brokers/**'
      - '!docs/**'
      - '!e2e-tests/**'
      - '!examplebroker/**'
      - '!gotestcov'
      - '!snap/**'
    tags:
      - "*"
  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/qa.yaml'
      - '!.gitignore'
      - '!.gitmodules'
      - '!*.md'
      - '!COPYING*'
      - '!authd-oidc-brokers/**'
      - '!docs/**'
      - '!e2e-tests/**'
      - '!examplebroker/**'
      - '!gotestcov'
      - '!snap/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  GO_TESTS_TIMEOUT: 20m
  AUTHD_SSHD_STDERR_LOG_ALL_PAM_MESSAGES: true
  LXD_UBUNTU_VERSION: "2604"

  c_build_dependencies: >-
    clang-tools
    clang
    libglib2.0-dev
    libpam-dev

  go_build_dependencies: >-
    libglib2.0-dev
    libpam-dev
    libpwquality-dev

  go_test_dependencies: >-
    bubblewrap
    cracklib-runtime
    git-delta
    openssh-client
    openssh-server

jobs:
  go-sanity:
    name: "Go: Code sanity"
    permissions: {}
    runs-on: ubuntu-24.04 # ubuntu-latest-runner
    steps:
      - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
      - name: Install dependencies
        run: |
          # Install dependencies
          set -eu

          sudo apt-get update
          sudo apt-get install -y ${{ env.go_build_dependencies }}
      - uses: actions/checkout@v7
      - name: Go code sanity check
        uses: canonical/desktop-engineering/gh-actions/go/code-sanity@v2
        with:
          golangci-lint-configfile: ".golangci.yaml"
          tools-directory: "tools"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cmd/authd with withexamplebroker tag
        run: |
          set -eu
          go build -tags withexamplebroker ./cmd/authd
      - name: Run PAM client for interactive testing purposes
        run: |
          set -eu
          go run -tags withpamrunner ./pam/tools/pam-runner login --exec-debug
      - name: Generate PAM module
        run: |
          set -eu
          find pam -name '*.so' -print -delete
          go generate -C pam -x
          test -e pam/pam_authd.so
          test -e pam/go-exec/pam_authd_exec.so
      - name: Generate PAM module with pam_debug tag
        run: |
          set -eu
          find pam -name '*.so' -print -delete
          go generate -C pam -x -tags pam_debug
          test -e pam/pam_authd.so
          test -e pam/go-exec/pam_authd_exec.so

  shell-sanity:
    name: "Shell: Code sanity"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: "./authd-oidc-brokers"

  rust-sanity:
    name: "Rust: Code sanity"
    permissions: {}
    runs-on: ubuntu-24.04 # ubuntu-latest-runner
    steps:
      - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
      - name: Install dependencies
        run: |
          # Install dependencies
          set -eu

          sudo apt-get update
          # In Rust the grpc stubs are generated at build time
          # so we always need to install the protobuf compilers
          # when building the NSS crate.
          sudo apt-get install -y protobuf-compiler
      - uses: actions/checkout@v7
      - name: Rust code sanity check
        uses: canonical/desktop-engineering/gh-actions/rust/code-sanity@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  c-sanity:
    name: "C Code sanity"
    runs-on: ubuntu-24.04 # ubuntu-latest-runner
    env:
      CFLAGS: "-Werror"
    steps:
      - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
      - name: Install dependencies
        run: |
          # Install dependencies
          set -eu

          sudo apt-get update
          sudo apt-get install -y ${{ env.c_build_dependencies }}
      - name: Prepare report dir
        run: |
          set -eu

          scan_build_dir=$(mktemp -d --tmpdir scan-build-dir-XXXXXX)
          echo SCAN_BUILD_REPORTS_PATH="${scan_build_dir}" >> $GITHUB_ENV
      - uses: actions/checkout@v7
      - name: Run scan build on GDM extensions
        run: |
          set -eu

          scan-build -v -o "${SCAN_BUILD_REPORTS_PATH}" clang ${CFLAGS} \
            -Wno-gnu-variable-sized-type-not-at-end \
            pam/internal/gdm/extension.h
      - name: Run scan build on go-exec module
        run: |
          set -eu

          scan-build -v -o "${SCAN_BUILD_REPORTS_PATH}" clang ${CFLAGS} \
            -DAUTHD_TEST_MODULE=1 \
            $(pkg-config --cflags --libs gio-unix-2.0 gio-2.0) \
            -lpam -shared -fPIC \
            pam/go-exec/module.c
      - name: Upload scan build reports
        uses: actions/upload-artifact@v7
        with:
          name: authd-${{ github.job }}-artifacts-${{ github.run_attempt }}
          path: ${{ env.SCAN_BUILD_REPORTS_PATH }}

  go-tests-coverage:
    name: "Go Tests with Coverage Collection"
    runs-on: ubuntu-24.04 # ubuntu-latest-runner
    env:
      RAW_COVERAGE_DIR: ${{ github.workspace }}/raw-coverage
      COVERAGE_DIR: ${{ github.workspace }}/coverage
      # Also run tests which require a different Ubuntu version, which we run in LXD
      # containers.
      AUTHD_TESTS_USE_LXD: true
    steps:
      - uses: actions/checkout@v7
      - id: setup-go-tests
        uses: ./.github/actions/setup-go-tests
      - uses: ./.github/actions/setup-go-coverage-tests
      # Installation of debug symbols takes a long time (and fails currently),
      # so we skip it for now. Enable on demand.
      # - uses: ./.github/actions/install-debug-symbols
      #   continue-on-error: true

      - name: Run tests with coverage collection
        env:
          G_DEBUG: "fatal-criticals"
        run: |
          set -euo pipefail

          # The coverage is not written if the output directory does not exist, so we need to create it.
          mkdir -p "${RAW_COVERAGE_DIR}"

          # Print executed commands to ease debugging
          set -x

          # Work around https://github.com/golang/go/issues/75031
          go env -w GOTOOLCHAIN="$(go version | awk '{ print $3 }')+auto"

          # Overriding the default coverage directory is not an exported flag of go test (yet), so
          # we need to override it using the test.gocoverdir flag instead.
          #TODO: Update when https://go-review.googlesource.com/c/go/+/456595 is merged.
          go test -json -timeout ${GO_TESTS_TIMEOUT} -cover -covermode=set ./... -coverpkg=./... \
            -shuffle=on -args -test.gocoverdir="${RAW_COVERAGE_DIR}" | \
            gotestfmt --logfile "${AUTHD_TESTS_ARTIFACTS_PATH}/gotestfmt.cover.log"

      # Upload the test output for the go-tests-coverage-retry job which retries
      # the failed tests.
      - name: Upload JSON test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-output
          path: ${{ env.AUTHD_TESTS_ARTIFACTS_PATH }}/gotestfmt.cover.stdout

      # Upload the raw coverage data so that the go-tests-coverage-retry job has
      # all the data to generate the coverage report (if the tests succeed on
      # retry).
      - name: Upload raw coverage on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raw-coverage-data
          path: ${{ env.RAW_COVERAGE_DIR }}

      - uses: ./.github/actions/generate-coverage-report
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Export LXD test image for cache
        id: export-lxd-test-image
        if: always() && steps.setup-go-tests.outputs.lxd-image-cache-matched-key == ''
        uses: ./.github/actions/export-lxd-test-image-for-cache

      - name: Save LXD test image cache
        if: always() && steps.setup-go-tests.outputs.lxd-image-cache-matched-key == '' && steps.export-lxd-test-image.outputs.cache-exported == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/authd-lxd-image-cache/ubuntu-${{ env.LXD_UBUNTU_VERSION }}.tar
          key: ${{ steps.setup-go-tests.outputs.lxd-image-cache-primary-key }}

      - uses: ./.github/actions/upload-test-artifacts
        if: always()

  go-tests-coverage-retry:
    name: "Retry Go Tests with Coverage Collection"
    needs: go-tests-coverage
    if: always() && needs.go-tests-coverage.result == 'failure'
    runs-on: ubuntu-24.04
    env:
      RAW_COVERAGE_DIR: ${{ github.workspace }}/raw-coverage
      COVERAGE_DIR: ${{ github.workspace }}/coverage
      # Also run tests which require a different Ubuntu version, which we run in LXD
      # containers.
      AUTHD_TESTS_USE_LXD: true
    steps:
      - uses: actions/checkout@v7
      - id: setup-go-tests
        uses: ./.github/actions/setup-go-tests
      - uses: ./.github/actions/setup-go-coverage-tests
      # Installation of debug symbols takes a long time (and fails currently),
      # so we skip it for now. Enable on demand.
      # - uses: ./.github/actions/install-debug-symbols
      #   continue-on-error: true

      - name: Download JSON output of failed tests
        uses: actions/download-artifact@v8
        with:
          name: coverage-test-output
          path: /tmp/coverage-test-output

      - name: Download raw coverage data
        uses: actions/download-artifact@v8
        with:
          name: raw-coverage-data
          path: ${{ env.RAW_COVERAGE_DIR }}

      - name: Install gotest-rerun-failed
        run: go install github.com/adombeck/gotest-rerun-failed@latest

      - name: Retry failed tests with coverage collection
        run: |
          set -euo pipefail

          # Print executed commands to ease debugging
          set -x

          test_output="/tmp/coverage-test-output/gotestfmt.cover.stdout"
          for i in $(seq 1 3); do
            echo "Retrying failed tests (attempt ${i})"
            gotest-rerun-failed -json -timeout ${GO_TESTS_TIMEOUT} -cover -covermode=set -- -coverpkg=./... \
              -shuffle=on -args -test.gocoverdir="${RAW_COVERAGE_DIR}" \
              < "${test_output}" \
              | gotestfmt --logfile "${AUTHD_TESTS_ARTIFACTS_PATH}/gotestfmt.cover.retry-$i.log" \
              && exit_code=0 || exit_code=$?
            if [ "${exit_code}" -eq 0 ]; then
              break
            fi
            if [ "${i}" -eq 3 ]; then
              echo "Tests failed 3 times, giving up"
              exit ${exit_code}
            fi
            test_output="${AUTHD_TESTS_ARTIFACTS_PATH}/gotestfmt.cover.retry-$i.stdout"
          done

      - uses: ./.github/actions/generate-coverage-report
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Export LXD test image for cache
        id: export-lxd-test-image
        if: always() && steps.setup-go-tests.outputs.lxd-image-cache-matched-key == ''
        uses: ./.github/actions/export-lxd-test-image-for-cache

      - name: Save LXD test image cache
        if: always() && steps.setup-go-tests.outputs.lxd-image-cache-matched-key == '' && steps.export-lxd-test-image.outputs.cache-exported == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/authd-lxd-image-cache/ubuntu-${{ env.LXD_UBUNTU_VERSION }}.tar
          key: ${{ steps.setup-go-tests.outputs.lxd-image-cache-primary-key }}

      - uses: ./.github/actions/upload-test-artifacts
        if: always()

  go-tests-race:
    name: "Go Tests with Race Detector"
    runs-on: ubuntu-24.04 # ubuntu-latest-runner
    steps:
      - uses: actions/checkout@v7
      - id: setup-go-tests
        uses: ./.github/actions/setup-go-tests
      # Installation of debug symbols takes a long time (and fails currently),
      # so we skip it for now. Enable on demand.
      # - uses: ./.github/actions/install-debug-symbols
      #   continue-on-error: true

      - name: Run tests with race detector
        env:
          GO_TESTS_TIMEOUT: 35m
          AUTHD_TESTS_SLEEP_MULTIPLIER: 3
          AUTHD_SKIP_FLAKY_TESTS: true
          GORACE: log_path=${{ env.AUTHD_TESTS_ARTIFACTS_PATH }}/gorace.log
        run: |
          go test -json -timeout ${GO_TESTS_TIMEOUT} -race -failfast ./... | \
            gotestfmt --logfile "${AUTHD_TESTS_ARTIFACTS_PATH}/gotestfmt.race.log" || exit_code=$?

          if [ "${exit_code:-0}" -ne 0 ]; then
            cat "${AUTHD_TESTS_ARTIFACTS_PATH}"/gorace.log* || true
            exit ${exit_code}
          fi

      - uses: ./.github/actions/upload-test-artifacts
        if: always()

  go-tests-asan:
    name: "Go PAM tests with Address Sanitizer"
    runs-on: ubuntu-24.04 # ubuntu-latest-runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-tests
      # Installation of debug symbols takes a long time (and fails currently),
      # so we skip it for now. Enable on demand.
      # - uses: ./.github/actions/install-debug-symbols
      #   continue-on-error: true

      - name: Run PAM tests with Address Sanitizer
        env:
          # Do not optimize, keep debug symbols and frame pointer for better
          # stack trace information in case of ASAN errors.
          CGO_CFLAGS: "-O0 -g3 -fno-omit-frame-pointer"
          G_DEBUG: "fatal-criticals"
          GO_TESTS_TIMEOUT: 30m
          AUTHD_TESTS_SLEEP_MULTIPLIER: 1.5
          AUTHD_SKIP_FLAKY_TESTS: true
          # Use these flags to give ASAN a better time to unwind the stack trace
          GO_GC_FLAGS: -N -l
        run: |
          # Print executed commands to ease debugging
          set -x

          echo "::group::Install llvm-symbolizer"
          # For llvm-symbolizer
          sudo apt-get install -y llvm
          echo "::endgroup::"

          go test -C ./pam/internal -json -asan -gcflags=all="${GO_GC_FLAGS}" -failfast -timeout ${GO_TESTS_TIMEOUT} ./... | \
            gotestfmt --logfile "${AUTHD_TESTS_ARTIFACTS_PATH}/gotestfmt.pam-internal-asan.log" || exit_code=$?
          if [ -n "${exit_code:-}" ]; then
            cat "${AUTHD_TESTS_ARTIFACTS_PATH}"/asan.log* || true
            exit ${exit_code}
          fi

          echo "Running PAM integration tests"
          pushd ./pam/integration-tests
          go test -asan -gcflags=all="${GO_GC_FLAGS}" -c

          run_pam_integration_tests() {
            local log_suffix=""
            if [ "$#" -gt 0 ]; then
              log_suffix="${1}"
              shift
            fi
            go tool test2json -p pam/integrations-test ./integration-tests.test \
              -test.v=test2json \
              -test.failfast \
              -test.timeout "${GO_TESTS_TIMEOUT}" \
              "$@" | \
            tee "${AUTHD_TESTS_ARTIFACTS_PATH}/test2json.pam-integration-tests-asan${log_suffix}.json" | \
            gotestfmt --logfile "${AUTHD_TESTS_ARTIFACTS_PATH}/gotestfmt.pam-integration-tests-asan${log_suffix}.log"
          }

          # Names of the tests that failed in the given test2json output. Keep
          # failed subtests, but omit their duplicate top-level failure event.
          failed_test_paths() {
            [ -s "${1}" ] || return 0
            jq -r 'select(.Action == "fail" and .Test != null) | .Test' "${1}" |
              sort -u |
              awk '
                { failed[$0] = 1 }
                END {
                  for (test in failed) {
                    has_failed_descendant = 0
                    for (candidate in failed) {
                      if (candidate != test && index(candidate, test "/") == 1) {
                        has_failed_descendant = 1
                        break
                      }
                    }
                    if (!has_failed_descendant) print test
                  }
                }
              ' |
              sort -u
          }

          # Check that every test that started reached a terminal event.
          test_output_is_complete() {
            local test_output="${1}"
            [ -s "${test_output}" ] || return 1
            jq -e -s '
              all(.[]; type == "object" and (.Action | type) == "string") and
              ([.[] | select(.Action == "run")] | length) > 0 and
              ([.[] | select(.Action == "run")] |
                all(.[]; (.Test | type) == "string" and (.Test | length) > 0)) and
              (
                ([.[] | select(.Action == "run") |
                  [(.Package // ""), .Test] | @json] | unique) as $started |
                ([.[] |
                  select(
                    (.Action == "pass" or .Action == "fail" or
                     .Action == "skip" or .Action == "bench") and
                    (.Test | type) == "string"
                  ) |
                  [(.Package // ""), .Test] | @json] | unique) as $terminal |
                (($started - $terminal) | length) == 0
              )
            ' "${test_output}" >/dev/null
          }

          # Turn a test name into a -test.run pattern that matches the exact
          # test path, escaping each component independently.
          test_run_pattern() {
            local test_name="${1}"
            local component
            local escaped
            local pattern=""
            local -a components
            IFS=/ read -ra components <<< "${test_name}"
            for component in "${components[@]}"; do
              escaped=$(printf '%s' "${component}" | sed 's/[.[\^$*+?(){|\\]/\\&/g')
              pattern="${pattern:+${pattern}/}^${escaped}$"
            done
            printf '%s' "${pattern}"
          }

          # Retry only ASAN internal checks. Other sanitizer diagnostics may
          # indicate a real memory error and must fail directly.
          asan_internal_check_failure() {
            local logs=(
              "${AUTHD_TESTS_ARTIFACTS_PATH}"/asan.log*
              "${AUTHD_TESTS_ARTIFACTS_PATH}/test2json.pam-integration-tests-asan.json"
            )
            local found_asan_error=0
            local f
            for f in "${logs[@]}"; do
              [ -e "${f}" ] || continue
              if grep -qF "AddressSanitizer:" "${f}"; then
                found_asan_error=1
                if grep -F "AddressSanitizer:" "${f}" | grep -qvF "CHECK failed"; then
                  return 1
                fi
              fi
            done
            [ "${found_asan_error}" -eq 1 ]
          }

          exit_code=0
          if run_pam_integration_tests; then
            :
          else
            exit_code=$?
            if asan_internal_check_failure; then
              # Only the tests that failed are retried. If none could be identified
              # (e.g. the test binary died before reporting any test result), the
              # whole suite is retried instead.
              test_output="${AUTHD_TESTS_ARTIFACTS_PATH}/test2json.pam-integration-tests-asan.json"
              if ! test_output_is_complete "${test_output}"; then
                echo "ASAN internal check failure detected — test output incomplete; retrying all tests"
                failed_test_names=""
              else
                failed_test_names=$(failed_test_paths "${test_output}")
              fi
              if [ -n "${failed_test_names}" ]; then
                retry_exit_code=0
                retry_index=0
                while IFS= read -r failed_test_name; do
                  [ -n "${failed_test_name}" ] || continue
                  retry_index=$((retry_index + 1))
                  echo "ASAN internal check failure detected — retrying failed test: ${failed_test_name}"
                  retry_args=("-test.run=$(test_run_pattern "${failed_test_name}")")
                  run_pam_integration_tests "-retry-${retry_index}" \
                    "${retry_args[@]}" || retry_exit_code=$?
                done <<< "${failed_test_names}"
                exit_code=${retry_exit_code}
              else
                echo "ASAN internal check failure detected — retrying all tests"
                exit_code=0
                run_pam_integration_tests "-retry" || exit_code=$?
              fi
              for f in "${AUTHD_TESTS_ARTIFACTS_PATH}"/asan.log*; do
                [ -e "${f}" ] && mv "${f}" "${f}.prev"
              done
            fi
          fi
          popd || exit

          # We don't need the xtrace output after this point
          set +x

          # We're logging to a file, and this is useful for having artifacts, but we still may want to see it in logs.
          # Print up to asan_log_preview_lines lines in total across all ASAN logs unconditionally (always visible),
          # with the full content of each log also available in a collapsible group.
          asan_log_preview_lines=50
          asan_log_remaining=${asan_log_preview_lines}
          for f in "${AUTHD_TESTS_ARTIFACTS_PATH}"/asan.log*; do
            if ! [ -e "${f}" ]; then
              continue
            fi
            if [ -s "${f}" ]; then
              total_lines=$(wc -l < "${f}")
              if [ "${asan_log_remaining}" -le 0 ]; then
                echo "=== ${f} (${total_lines} lines, omitted from preview — see collapsible group below) ==="
              elif [ "${total_lines}" -gt "${asan_log_remaining}" ]; then
                echo "=== ${f} (first ${asan_log_remaining} of ${total_lines} lines) ==="
                head -n "${asan_log_remaining}" "${f}"
                echo "... (truncated — see collapsible group below for the full log)"
                asan_log_remaining=0
              else
                echo "=== ${f} (${total_lines} lines) ==="
                cat "${f}"
                asan_log_remaining=$((asan_log_remaining - total_lines))
              fi
              echo "::group::${f} (full ${total_lines} lines)"
              cat "${f}"
              echo "::endgroup::"
            else
              echo "${f}: empty"
            fi
          done

          exit ${exit_code}

      - uses: ./.github/actions/upload-test-artifacts
        if: always()
