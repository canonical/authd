name: provision-e2e-test (reusable)

on:
  workflow_call:
    inputs:
      files-hash:
        description: 'Hash of build-relevant files, used as cache key and concurrency group'
        type: string
        required: true
      ubuntu-version:
        required: true
        type: string
      force-fresh-image:
        description: 'Force creation of a fresh VM image by ignoring cache'
        type: boolean
        required: false
        default: false
      broker-snap-channel:
        description: 'If set, download the broker snap from this Snap Store channel instead of building it from source'
        type: string
        required: false
        default: ''
      authd-ppa:
        description: 'If set, use this PPA instead of authd-edge when installing the authd package and its dependencies'
        type: string
        required: false
        default: ''
      e2e-tests-description:
        description: 'PR description containing an optional e2e-tests: suite list'
        type: string
        required: false
        default: ''
    secrets:
      E2E_VM_SSH_PRIV_KEY:
        required: true
      E2E_VM_SSH_PUB_KEY:
        required: true

env:
  DEBIAN_FRONTEND: noninteractive
  VM_NAME_BASE: e2e-runner
  ARTIFACTS_DIR: /tmp/e2e-artifacts
  E2E_TESTS_DIR: e2e-tests

jobs:
  provision-vm:
    name: Provision VM
    runs-on: ubuntu-latest
    permissions:
      # Needed by actions/checkout
      contents: read
      # Needed to push OCI artifact to ghcr.io
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Restore cached VM image (if available)
        id: restore-cache
        if: ${{ !inputs.force-fresh-image }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ARTIFACTS_DIR }}/${{ env.VM_NAME_BASE }}-${{ inputs.ubuntu-version }}.qcow2
          key: >-
            e2e-runner-vm-${{ inputs.ubuntu-version }}-${{ hashFiles(
              'e2e-tests/vm/**',
              '.github/actions/e2e-tests/set-up-ssh-keys/**',
              '.github/workflows/e2e-tests-provision-and-run.yaml',
              'debian/control',
              'debian/rules'
            ) }}
          fail-on-cache-miss: false

      - uses: canonical/desktop-engineering/gh-actions/common/dpkg-install-speedup@main
        if: steps.restore-cache.outputs.cache-hit != 'true' || inputs.force-fresh-image

      - name: Install APT dependencies for VM provisioning
        if: steps.restore-cache.outputs.cache-hit != 'true' || inputs.force-fresh-image
        run: ./${{ env.E2E_TESTS_DIR }}/vm/install-provision-deps.sh

      - name: Set up SSH keys for the VM provisioning
        id: set-ssh-keys
        if: steps.restore-cache.outputs.cache-hit != 'true' || inputs.force-fresh-image
        uses: ./.github/actions/e2e-tests/set-up-ssh-keys
        with:
          E2E_VM_SSH_PRIV_KEY: ${{ secrets.E2E_VM_SSH_PRIV_KEY }}
          E2E_VM_SSH_PUB_KEY: ${{ secrets.E2E_VM_SSH_PUB_KEY }}

      - name: Provision the VM
        id: provision-vm
        if: steps.restore-cache.outputs.cache-hit != 'true' || inputs.force-fresh-image
        run: |
          set -eu
          export PATH="$(realpath "${{ env.E2E_TESTS_DIR }}/vm/helpers"):${PATH}"
          mkdir -p ${{ env.ARTIFACTS_DIR }}
          env VM_NAME_BASE="${{ env.VM_NAME_BASE }}" \
            RELEASE="${{ inputs.ubuntu-version }}" \
            ARTIFACTS_DIR="${{ env.ARTIFACTS_DIR }}" \
            SSH_PUBLIC_KEY_FILE="${{ steps.set-ssh-keys.outputs.keys-path }}/id_rsa.pub" \
            ./${{ env.E2E_TESTS_DIR }}/vm/provision-ubuntu.sh

      - name: Clean previous cache
        if: always() && steps.provision-vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          gh cache delete e2e-runner-${{ inputs.ubuntu-version }} || true
          echo "Previous cache (if any) deleted"

      - name: Cache the VM image
        uses: actions/cache/save@v6
        if: always() && steps.provision-vm.outcome == 'success'
        with:
          path: ${{ env.ARTIFACTS_DIR }}/${{ env.VM_NAME_BASE }}-${{ inputs.ubuntu-version }}.qcow2
          key: >-
            e2e-runner-vm-${{ inputs.ubuntu-version }}-${{ hashFiles(
              'e2e-tests/vm/**',
              '.github/actions/e2e-tests/set-up-ssh-keys/**',
              '.github/workflows/e2e-tests-provision-and-run.yaml',
              'debian/control',
              'debian/rules'
            ) }}

      - uses: ./.github/actions/setup-oras
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload VM image as OCI artifact
        if: steps.provision-vm.outcome == 'success' || steps.restore-cache.outputs.cache-hit == 'true'
        env:
          IMAGE_PATH: ${{ env.ARTIFACTS_DIR }}/${{ env.VM_NAME_BASE }}-${{ inputs.ubuntu-version }}.qcow2
          OCI_REPO: ghcr.io/${{ github.repository }}/e2e-runner
          OCI_TAG: ${{ inputs.ubuntu-version }}
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Push the qcow2 as a single layer. It used to be split into
          # many small chunks hoping unchanged chunks would be deduped
          # and skipped, but in practice each provisioning run bakes in
          # new random data (UUIDs, timestamps, ...) so virtually no
          # chunks are ever reused - we just paid for dozens of extra
          # API requests per push, which was tripping ghcr.io's
          # secondary rate limit.
          image_dir="$(dirname "$IMAGE_PATH")"
          image_name="$(basename "$IMAGE_PATH")"
          (
            cd "$image_dir"
            oras push "${OCI_REPO}:${OCI_TAG}" "$image_name" \
              --artifact-type application/vnd.qemu.qcow2
          )

  build-deb:
    uses: ./.github/workflows/debian-build.yaml
    with:
      files-hash: ${{ inputs.files-hash }}
      ubuntu-version: ${{ inputs.ubuntu-version }}
    secrets: inherit

  e2e-test:
    needs:
      - provision-vm
      - build-deb
    strategy:
      matrix:
        broker: [authd-msentraid, authd-google]
      fail-fast: false
    uses: ./.github/workflows/e2e-tests-run.yaml
    with:
      ubuntu-version: ${{ inputs.ubuntu-version }}
      broker: ${{ matrix.broker }}
      broker-snap-channel: ${{ inputs.broker-snap-channel }}
      authd-ppa: ${{ inputs.authd-ppa }}
      e2e-tests-description: ${{ inputs.e2e-tests-description }}
    secrets: inherit
