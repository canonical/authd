name: shell-sanity

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/shell-sanity.yaml"
      - ".shellcheckrc"
      - "brokers/.shellcheckrc"
      - ".workshop/authd/hooks/**"
      - ".workshop/authd/scripts/**"
      - "**.sh"
      - "brokers/tools/install-cargo-c"
      - "debian/postinst"
      - "debian/postrm"
      - "debian/prerm"
      - "e2e-tests/vm/helpers/virsh"
      - "scripts/golangci-lint"
      - "scripts/gotestcov"
      - "snap/hooks/**"
      - "snap/scripts/**"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-sanity:
    name: "Shell: Code sanity"
    runs-on: ubuntu-26.04 # ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: "postinst postrm prerm"

      - name: Check Workshop PAM config matching
        shell: bash
        run: |-
          source .workshop/authd/lib/health-checks.sh
          authd_pam_has_module /dev/stdin auth pam_authd.so <<<'auth [default=ignore success=ok] pam_authd.so'
          if authd_pam_has_module /dev/stdin auth pam_authd.so <<<'auth required pam_other.so pam_authd.so # pam_authd.so'; then
            echo "PAM match accepted a module name in an argument" >&2
            exit 1
          fi
