name: shell-sanity

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/shell-sanity.yaml"
      - ".shellcheckrc"
      - "brokers/.shellcheckrc"
      - ".workshop/**"
      - "**.sh"
      - "brokers/tools/install-cargo-c"
      - "debian/postinst"
      - "debian/postrm"
      - "debian/prerm"
      - "e2e-tests/vm/helpers/virsh"
      - "scripts/golangci-lint"
      - "scripts/gotestcov"
      - "snap/hooks/**"
      - "snap/scripts/**"
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-sanity:
    name: "Shell: Code sanity"
    runs-on: ubuntu-26.04 # ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: "postinst postrm prerm"

      - name: Run ShellCheck on the Workshop scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .workshop
          additional_files: >-
            broker build-component gdm lint login logs test validate
            setup-base setup-project save-state restore-state
