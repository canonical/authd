name: Update uv

on:
  schedule:
    # Check for new uv releases every Monday at 02:00 UTC.
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-uv

jobs:
  update-uv:
    if: github.event_name != 'schedule' || github.repository == 'canonical/authd'
    runs-on: ubuntu-26.04 # ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update to the latest uv release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_FILE: .github/uv-requirements.txt
        shell: bash
        run: |
          set -euo pipefail

          release=$(gh api repos/astral-sh/uv/releases/latest)
          version=$(jq --raw-output '.tag_name | ltrimstr("v")' <<<"${release}")

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest uv release has an unexpected version tag: ${version}" >&2
            exit 1
          fi

          current_requirement=$(cat "${VERSION_FILE}")
          if [[ ! "${current_requirement}" =~ ^uv==([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected one exact uv version in ${VERSION_FILE}" >&2
            exit 1
          fi
          current_version="${BASH_REMATCH[1]}"

          if [[ "${version}" == "${current_version}" ]]; then
            echo "No uv update is needed (latest version: ${version})"
            exit 0
          fi

          printf 'uv==%s\n' "${version}" > "${VERSION_FILE}"

          echo "modified=true" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Fetch YARF
        if: steps.update.outputs.modified == 'true'
        run: git submodule update --init --depth=1 e2e-tests/.yarf

      - uses: actions/setup-python@v7
        if: steps.update.outputs.modified == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.update.outputs.modified == 'true'
        with:
          version-file: .github/uv-requirements.txt
          enable-cache: true
          cache-dependency-glob: e2e-tests/uv.lock

      - name: Test the lock helper
        if: steps.update.outputs.modified == 'true'
        run: python -m unittest discover -s e2e-tests -p test_update_dependencies.py

      - name: Refresh the E2E lock
        if: steps.update.outputs.modified == 'true'
        run: python e2e-tests/update_dependencies.py

      - name: Check YARF runtime versions
        if: steps.update.outputs.modified == 'true'
        run: python e2e-tests/update_dependencies.py --check

      - name: Prepare pull request body
        if: steps.update.outputs.modified == 'true'
        env:
          UV_VERSION: ${{ steps.update.outputs.version }}
        run: |
          {
            printf 'Updates the pinned uv checker to %s and refreshes the E2E lock under YARF runtime constraints.\n\n' "${UV_VERSION}"
            cat <<'EOF'
          Validation with the new uv version:
          - `python -m unittest discover -s e2e-tests -p test_update_dependencies.py` (passed).
          - `python e2e-tests/update_dependencies.py` (passed).
          - `python e2e-tests/update_dependencies.py --check` (passed).

          These checks ran in the updater workflow. PRs created with GITHUB_TOKEN
          do not trigger normal PR CI. Close and reopen the PR to run those checks.
          EOF
            cat .github/pull_request_template.md
          } > "${RUNNER_TEMP}/uv-update-pr-body.md"

      - name: Create pull request
        if: steps.update.outputs.modified == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto-update-uv
          delete-branch: true
          sign-commits: true
          add-paths: |
            .github/uv-requirements.txt
            e2e-tests/uv.lock
          commit-message: "deps(ci): update uv to ${{ steps.update.outputs.version }}"
          title: "deps(ci): update uv to ${{ steps.update.outputs.version }}"
          body-path: ${{ runner.temp }}/uv-update-pr-body.md
