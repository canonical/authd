name: Update agentic workflows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-bot-signing:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Test the signer locally
        run: python3 -m unittest discover -s .github/scripts -p 'test_sign_agentic_update.py'

      - name: Stage a workflow-file update
        run: |
          printf '\n# Temporary bot-signing permission fixture.\n' >> .github/workflows/update-agentic-workflows.yaml
          git add .github/workflows/update-agentic-workflows.yaml
          git write-tree > "${RUNNER_TEMP}/expected-tree"

      - name: Create the signed bot commit
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_UPDATE_TOKEN: ${{ secrets.AGENTIC_WORKFLOW_UPDATE_TOKEN }}
        run: |
          python3 .github/scripts/sign_agentic_update.py \
            --message "ci: test signed bot publication of workflow changes"
          git rev-parse HEAD > "${RUNNER_TEMP}/expected-commit"

      - name: Prepare the test PR body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf 'Temporary automated bot-signing test from [this workflow run](%s).\n\n' "${RUN_URL}"
            printf 'Validation: `python3 -m unittest discover -s .github/scripts -p test_sign_agentic_update.py`: passed.\n'
            printf 'Only a workflow comment changes. This draft PR will be closed after verification.\n'
            cat .github/pull_request_template.md
          } > "${RUNNER_TEMP}/bot-signing-pr.md"

      - name: Publish using the PAT and open using GITHUB_TOKEN
        id: pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          token: ${{ github.token }}
          branch-token: ${{ secrets.AGENTIC_WORKFLOW_UPDATE_TOKEN }}
          branch: ci/agentic-bot-signing-test-output-2d8d6b63
          draft: true
          title: "ci: temporary signed bot publication test"
          body-path: ${{ runner.temp }}/bot-signing-pr.md

      - name: Verify the published identity, signature, and tree
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          COMMITS_VERIFIED: ${{ steps.pr.outputs.pull-request-commits-verified }}
        run: |-
          set -euo pipefail
          test "${HEAD_SHA}" = "$(cat "${RUNNER_TEMP}/expected-commit")"
          test "${COMMITS_VERIFIED}" = "true"
          commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}")
          jq --exit-status \
            '.author.login == "github-actions[bot]" and .commit.verification.verified == true' \
            <<< "${commit}"
          test "$(jq --raw-output '.commit.tree.sha' <<< "${commit}")" = "$(cat "${RUNNER_TEMP}/expected-tree")"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          jq --exit-status \
            '.user.login == "github-actions[bot]" and .draft == true' <<< "${pr}"
          printf 'Verified PR #%s at commit %s\n' "${PR_NUMBER}" "${HEAD_SHA}"

# Temporary bot-signing permission fixture.
