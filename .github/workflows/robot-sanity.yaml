name: Robot Framework code sanity

on:
  push:
    branches:
      - main
    paths: &paths
      - 'e2e-tests/tests/**'
      - 'e2e-tests/resources/**'
      - 'e2e-tests/pyproject.toml'
      - 'e2e-tests/uv.lock'
      - '.gitmodules'
      - '.github/workflows/robot-sanity.yaml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-sanity:
    name: "Robot Framework: Code sanity"
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize YARF
        run: git submodule update --init --depth=1 e2e-tests/.yarf
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: e2e-tests/uv.lock
      - name: Install Robocop
        run: uv sync --project e2e-tests --locked --only-group robocop
      - name: Check Robot Framework formatting
        run: uv run --project e2e-tests --no-sync robocop format --check --no-cache e2e-tests/tests e2e-tests/resources
      - name: Check Robot Framework documentation
        run: uv run --project e2e-tests --no-sync robocop check --select DOC02 --select LEN12 --no-cache e2e-tests/tests
