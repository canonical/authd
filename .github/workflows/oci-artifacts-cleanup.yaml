name: Clean up OCI artifacts
on:
  schedule:
    # run every day at 5am UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: oci-artifacts-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04 # ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Delete OCI artifacts older than seven days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/cleanup_oci_artifacts.py
