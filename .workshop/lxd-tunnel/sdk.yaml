# In-project SDK carrying the tunnel plug for the manual GDM companion VM.
#
# The lxd plug receives the host LXD UNIX socket through Workshop's tunnel
# interface. The workshop definition deliberately requires a manual connection
# because controlling the host LXD daemon is host-root-equivalent. The LXD
# client itself installs lazily on first companion-vm use (see
# .workshop/authd/scripts/companion-vm-ctl), not in this SDK's setup-base, so
# a plain launch/refresh never pays for it.
name: lxd-tunnel
plugs:
  lxd:
    interface: tunnel
    endpoint: /var/lib/workshop/run/host-lxd/unix.socket
