[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "authd-oidc-brokers/third_party/libhimmelblau/**",
    "docs/**",
    "e2e-tests/.yarf/**",
]

[tool.ruff.lint]
# Use a focused baseline instead of Ruff's broader built-in defaults. These
# rules cover basic syntax and style errors, undefined or unused names, and
# import ordering.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# GTK and WebKit version registration, plus the script-local module path setup,
# must run before these imports when the login scripts are run directly.
"e2e-tests/resources/browser_login/base.py" = ["E402"]
# BrowserWindow has the same runtime imports and uses a no-op lambda as the
# GLib callback for a retry path.
"e2e-tests/resources/browser_login/browser_window.py" = ["E402", "E731"]
"e2e-tests/resources/browser_login/google.py" = ["E402"]
"e2e-tests/resources/browser_login/msentraid.py" = ["E402"]
